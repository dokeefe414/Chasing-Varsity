name: Browser Game CI
on:
  push:
    branches: [main, feature/v1-1-gameplay-polish]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Verify JavaScript parses
        run: |
          for source in *.js; do node --check "$source"; done
          for source in tests/*.js; do node --check "$source"; done
      - name: Run gameplay tests
        run: npm test
